---
services:
  rpi5-tftp:
    image: ghcr.io/netbootxyz/netbootxyz
    container_name: rpi5-tftp
    entrypoint: ["dnsmasq"]
    command:
      - --no-daemon
      - --port=0
      - --log-facility=-
      - --enable-tftp
      - --tftp-root=/tftp
      - --interface=eth0
      - --bind-interfaces
      - --log-dhcp
      - --dhcp-range=192.168.8.0,proxy
      - --pxe-service=0,"Raspberry Pi Boot"
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - ./assets/rpi5-tftp:/tftp:ro
    healthcheck:
      disable: true
    restart: unless-stopped

  netbootxyz:
    image: ghcr.io/netbootxyz/netbootxyz
    container_name: netbootxyz
    environment:
      - MENU_VERSION=2.0.84 # optional
      - NGINX_PORT=80 # optional
      - WEB_APP_PORT=3000 # optional
        #volumes:
      #- /path/to/config:/config # optional
      #- /path/to/assets:/assets # optional
    ports:
      - 3000:3000  # optional, destination should match ${WEB_APP_PORT} variable above.
      - 69:69/udp
      - 8080:80  # optional, destination should match ${NGINX_PORT} variable above.
    restart: unless-stopped
